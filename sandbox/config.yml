site_url: https://code-learn-build-evolve.vercel.app/
show_preview_links: false
backend:
  name: github
  repo: WoAiXueXiHa/my-blog
  branch: cms-editor-test
  base_url: https://code-learn-build-evolve.vercel.app
  auth_endpoint: api/auth
  site_domain: code-learn-build-evolve.vercel.app
  auth_scope: public_repo
media_folder: static/images
public_folder: /images
collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: content/posts
    delete: false
    create: true
    identifier_field: slug
    extension: md
    format: yaml-frontmatter
    slug: "{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    preview_path: "posts/{{dirname}}/"
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 英文路径
        name: slug
        widget: string
        required: true
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '只能使用小写字母、数字和连字符']
        hint: 测试新文章必填，例如 test；此字段决定 content/posts/<slug>/index.md 的目录名。
      - { label: 发布时间, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 修改时间, name: lastmod, widget: datetime, format: "YYYY-MM-DDTHH:mm:ssZ" }
      - { label: 发布, name: draft, widget: boolean, default: false }
      - label: 主题
        name: topic
        widget: select
        options: [golang, data-structures, algorithms, backend, networks, os, ai, mysql, reading, devops, frontend]
      - label: 分类
        name: categories
        widget: list
        hint: 至少一项；沿用已有大类，例如 Go 语言、MySQL、AI 工程、计算机网络、数据结构。输入后按 Enter。
        min: 1
        max: 20
        field: { label: 分类, name: category, widget: string }
      - label: 标签
        name: tags
        widget: list
        hint: 至少一项；写文章的具体关键词，例如 Go、并发、Channel。每输入一项按 Enter。
        min: 1
        max: 30
        field: { label: 标签, name: tag, widget: string }
      - { label: 摘要, name: summary, widget: text }
      - { label: 系列, name: series, widget: list, required: false, field: { label: 系列, name: item, widget: string } }
      - { label: 系列序号, name: seriesOrder, widget: number, required: false, value_type: int }
      - { label: 推荐, name: featured, widget: boolean, default: false, required: false }
      - { label: 状态, name: status, widget: string, required: false }
      - { label: 相关文章, name: related, widget: list, required: false, field: { label: 文章, name: item, widget: string } }
      - label: Markdown 正文
        name: body
        widget: richtext
        modes: [raw, rich_text]
        hint: 从二级标题开始。原文模式直接编辑 Markdown；切换到可视化模式可用格式和图片按钮。旧文包含公式或复杂代码时，切换模式后先核对内容再保存。
